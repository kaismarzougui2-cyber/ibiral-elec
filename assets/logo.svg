<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Gear + Lightning bolt icon -->
  <g transform="translate(4, 4)">
    <!-- Gear circle -->
    <circle cx="26" cy="26" r="22" fill="#1A2744" stroke="#F5A623" stroke-width="2.5"/>
    <!-- Gear teeth -->
    <g fill="#F5A623">
      <rect x="23.5" y="2" width="5" height="6" rx="1"/>
      <rect x="23.5" y="44" width="5" height="6" rx="1"/>
      <rect x="44" y="23.5" width="6" height="5" rx="1"/>
      <rect x="2" y="23.5" width="6" height="5" rx="1"/>
      <rect x="38.5" y="8.5" width="5" height="6" rx="1" transform="rotate(45 41 11.5)"/>
      <rect x="8.5" y="38.5" width="5" height="6" rx="1" transform="rotate(45 11 41.5)"/>
      <rect x="38.5" y="38.5" width="5" height="6" rx="1" transform="rotate(-45 41 41.5)"/>
      <rect x="8.5" y="8.5" width="5" height="6" rx="1" transform="rotate(-45 11 11.5)"/>
    </g>
    <!-- Inner circle -->
    <circle cx="26" cy="26" r="14" fill="#1A2744"/>
    <!-- Lightning bolt -->
    <path d="M29 13L17 28h10l-2 11 14-16H29l0-10z" fill="#F5A623"/>
  </g>
  <!-- Text: IBIRAL -->
  <text x="62" y="30" font-family="'Oswald', Arial Narrow, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="1">IBIRAL</text>
  <!-- Text: ELEC -->
  <text x="62" y="50" font-family="'Oswald', Arial Narrow, sans-serif" font-size="18" font-weight="600" fill="#F5A623" letter-spacing="2">ELEC</text>
</svg>
